<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <title>ระบบโหวตเสื้อสูทโรงเรียน</title>
  
  <link rel="icon" type="image/png" href="./logo.png">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    :root { --primary-green: #89C040; --primary-yellow: #FFB800; --text-dark: #2D3748; }
    body { font-family: "IBM Plex Sans Thai", sans-serif; background: linear-gradient(135deg, #FAF4E1 0%, #E8F5E9 100%); color: var(--text-dark); min-height: 100vh; overflow-x: hidden; }
    
    .vote-card { background: rgba(255, 255, 255, 0.95); border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.05); border: 1px solid rgba(255,255,255,0.8); backdrop-filter: blur(10px); }
    .choice { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; width: 100%; padding: 12px; border: 2px solid #E2E8F0; border-radius: 16px; background: #fff; cursor: pointer; transition: all 0.2s; }
    .choice:hover { border-color: var(--primary-green); transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
    .choice:has(input:checked) { border-color: var(--primary-green); background: #F0F9E8; box-shadow: 0 0 0 2px rgba(137, 192, 64, 0.2); }
    .choice input { accent-color: var(--primary-green); width: 22px; height: 22px; flex-shrink: 0; }
    .choice-img-container { width: 100%; height: 180px; position: relative; overflow: hidden; border-radius: 10px; border: 1px solid #f0f0f0; background: #f9f9f9; }
    .choice-img { width: 100%; height: 100%; object-fit: contain; transition: transform 0.3s; }
    .choice-img-container:hover .choice-img { transform: scale(1.05); }
    .zoom-hint { position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.7); color: white; padding: 4px 8px; border-radius: 6px; font-size: 12px; backdrop-filter: blur(4px); display: flex; align-items: center; gap: 4px;}
    .field { width: 100%; border: 2px solid #E2E8F0; border-radius: 12px; padding: 14px; transition: border-color 0.2s; font-size: 16px; }
    .field:focus { outline: none; border-color: var(--primary-green); }
    .btn-submit { background: var(--primary-green); color: white; transition: all 0.2s; }
    .btn-submit:hover:not(:disabled) { background: #76A836; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(137, 192, 64, 0.3); }
    .btn-submit:disabled { opacity: 0.6; cursor: wait; }
    
    /* Dashboard */
    .dashboard-view { display: none; background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%); min-height: 100vh; color: #1f2937; padding: 20px; overflow-y: auto;}
    .podium-container { display: flex; justify-content: center; align-items: flex-end; gap: 15px; margin-top: 40px; height: 550px; }
    .podium-item { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; width: 28%; position: relative; text-align: center; }
    .podium-img { width: 100%; height: 160px; object-fit: contain; background: white; border-radius: 16px; padding: 10px; margin-bottom: 15px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); z-index: 10; transition: transform 0.3s; }
    .rank-1 .podium-img { border: 4px solid #FFD700; height: 200px; box-shadow: 0 15px 40px rgba(255, 215, 0, 0.3); }
    .rank-2 .podium-img { border: 4px solid #C0C0C0; height: 160px; box-shadow: 0 10px 30px rgba(192, 192, 192, 0.4); }
    .rank-3 .podium-img { border: 4px solid #CD7F32; height: 140px; box-shadow: 0 10px 30px rgba(205, 127, 50, 0.4); }
    .podium-base { width: 100%; border-top-left-radius: 12px; border-top-right-radius: 12px; display: flex; flex-direction: column; justify-content: flex-start; align-items: center; padding-top: 15px; color: #111; font-weight: bold; position: relative; overflow: hidden; box-shadow: 0 -5px 20px rgba(0,0,0,0.05);}
    .rank-1 .podium-base { height: 160px; background: linear-gradient(180deg, #FFD700 0%, #DAA520 100%); }
    .rank-2 .podium-base { height: 120px; background: linear-gradient(180deg, #E8E8E8 0%, #B0C4DE 100%); }
    .rank-3 .podium-base { height: 90px; background: linear-gradient(180deg, #FFB38A 0%, #CD853F 100%); }
    .podium-rank-num { font-size: 3rem; line-height: 1; opacity: 0.9; color: #1f2937; text-shadow: 0 2px 4px rgba(255,255,255,0.6); }
    .rank-1 .podium-rank-num { font-size: 4.5rem; }

    .modal-overlay { animation: fadeIn 0.2s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body class="w-full relative">

  <!-- Header บาร์ด้านบนสุด (ปรับปรุงใหม่ แยกซ้าย-ขวา) -->
  <header id="vote-header" class="w-full bg-white/90 backdrop-blur-md fixed top-0 left-0 z-40 border-b border-gray-200 shadow-sm transition-all">
    <div class="max-w-7xl mx-auto px-4 py-2.5 flex items-center justify-between">
      
      <!-- ซ้าย: โลโก้ และ ชื่อระบบ -->
      <div class="flex items-center gap-2.5 sm:gap-3">
        <img src="./logo.png" class="w-9 h-9 sm:w-11 sm:h-11 drop-shadow-sm object-contain" alt="โลโก้โรงเรียน">
        <h1 class="font-bold text-emerald-800 text-[14px] sm:text-lg tracking-wide leading-tight line-clamp-1">
          ระบบโหวตสีสูทโรงเรียนบางสะพานวิทยา
        </h1>
      </div>

      <!-- ขวา: ปุ่มจัดการเล็กๆ ซ่อนคำบนมือถือเพื่อประหยัดพื้นที่ -->
      <div class="flex items-center gap-1.5 sm:gap-2">
        <button onclick="switchView('dashboard')" class="text-xs sm:text-sm bg-gray-100 hover:bg-gray-200 text-gray-700 px-2.5 py-1.5 sm:px-3 sm:py-2 rounded-lg transition flex items-center gap-1.5 font-medium border border-gray-200">
          📊 <span class="hidden sm:inline">หน้าสรุปผล</span>
        </button>
        <button onclick="openAdmin()" class="text-xs sm:text-sm bg-gray-100 hover:bg-gray-200 text-gray-500 hover:text-yellow-600 px-2.5 py-1.5 sm:px-3 sm:py-2 rounded-lg transition flex items-center gap-1 font-medium border border-gray-200" title="สำหรับแอดมิน">
          ⚙️ <span class="hidden sm:inline">จัดการ</span>
        </button>
      </div>

    </div>
  </header>

  <!-- หน้าจอโหวตหลัก -->
  <div id="view-vote" class="w-full flex justify-center px-4 pt-24 pb-12 min-h-screen items-start">
    <!-- คอนเทนต์หลัก จัดเรียง Grid ใหม่ -->
    <main class="max-w-6xl w-full grid grid-cols-1 lg:grid-cols-[1.3fr_1fr] gap-6 sm:gap-8 items-start mx-auto">
      
      <!-- ส่วนที่ 1: ฟอร์มโหวต -->
      <section class="vote-card p-5 sm:p-8 relative w-full flex flex-col order-1">
        
        <div id="loading" class="absolute inset-0 bg-white/90 backdrop-blur-sm z-10 flex flex-col items-center justify-center rounded-[24px]">
          <div class="w-12 h-12 border-4 border-gray-100 border-t-[var(--primary-green)] rounded-full animate-spin"></div>
          <p class="mt-4 text-gray-600 font-medium">กำลังโหลดข้อมูล...</p>
        </div>

        <div class="text-center mb-6">
          <h2 class="text-2xl sm:text-3xl font-bold text-gray-800 tracking-tight">เลือกแบบที่คุณชื่นชอบ</h2>
          <p class="text-gray-500 mt-2 text-sm">กรุณากรอกชื่อและเลือกแบบเสื้อสูท 1 แบบ</p>
        </div>
        
        <form id="vote-form" class="flex-grow flex flex-col">
          <div class="mb-6">
            <label class="block font-semibold mb-2 text-sm text-gray-700">ชื่อ-นามสกุล (ผู้โหวต)</label>
            <input id="voter-name" class="field" type="text" placeholder="ระบุชื่อของคุณ..." required>
          </div>
          <fieldset class="flex-grow">
            <legend class="font-semibold mb-3 text-sm text-gray-700">เลือกแบบเสื้อสูท</legend>
            <div id="dynamic-choices" class="grid sm:grid-cols-2 gap-4 max-h-[60vh] overflow-y-auto pr-1 pb-2"></div>
          </fieldset>
          <button id="submit-button" type="submit" class="btn-submit mt-6 w-full rounded-xl py-4 px-5 font-bold text-lg shadow-md">ส่งผลโหวต</button>
        </form>
      </section>

      <!-- ส่วนที่ 2: ผลโหวตปัจจุบัน -->
      <section class="vote-card p-5 sm:p-8 flex flex-col h-full w-full order-2">
        <div class="flex justify-between items-start mb-6 border-b border-gray-100 pb-4">
          <div><h2 class="text-xl font-bold text-gray-800">ผลโหวตปัจจุบัน</h2></div>
          <div class="text-right">
            <span id="total-votes" class="block font-bold text-4xl text-[var(--primary-yellow)] leading-none">0</span> 
            <span class="text-xs text-gray-500 block mt-1">โหวตทั้งหมด</span>
          </div>
        </div>
        <div class="relative w-full mb-6" style="height:220px"><canvas id="results-chart"></canvas></div>
        <div id="results-list" class="space-y-3 text-sm flex-grow max-h-[50vh] overflow-y-auto pr-1"></div>
      </section>
    </main>
  </div>

  <!-- หน้าจอ Dashboard (สไตล์เวทีประกวด) -->
  <div id="view-dashboard" class="dashboard-view w-full">
    <div class="max-w-7xl mx-auto relative pt-4 pb-10">
      
      <!-- ปุ่มควบคุม -->
      <div class="absolute top-0 right-0 flex gap-3 z-50">
        <button onclick="toggleFullScreen()" class="bg-white hover:bg-gray-50 text-gray-700 border border-gray-200 px-4 py-2 rounded-xl text-sm font-semibold transition shadow-sm">⛶ ขยายเต็มจอ</button>
        <button onclick="switchView('vote')" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-xl text-sm font-semibold transition shadow-md">✕ ปิดหน้าโชว์ผล</button>
      </div>

      <!-- ส่วนหัว -->
      <div class="text-center mb-4 pt-4">
        <img src="./logo.png" class="w-24 h-24 sm:w-28 sm:h-28 mx-auto mb-6 rounded-3xl shadow-[0_10px_25px_rgba(0,0,0,0.1)] border-[4px] border-white bg-white/60 backdrop-blur-sm object-contain p-1 transform transition hover:scale-105">
        <h1 class="text-4xl sm:text-5xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-emerald-700 to-teal-500 tracking-wide drop-shadow-sm mb-4">
          สรุปผลโหวตเสื้อสูทแบบเรียลไทม์
        </h1>
        <p class="text-emerald-800 mt-2 text-xl bg-white/70 inline-block px-6 py-2.5 rounded-full border border-emerald-100 backdrop-blur-md shadow-sm font-medium">
          จำนวนผู้โหวตทั้งหมด: <span id="dash-total" class="text-emerald-600 font-bold text-3xl mx-2">0</span> คน
        </p>
      </div>

      <!-- โพเดียม Top 3 -->
      <div id="dashboard-podium" class="podium-container max-w-4xl mx-auto mb-16">
        <!-- จะถูกสร้างโดย JavaScript -->
      </div>

      <!-- อันดับที่เหลือ -->
      <div class="max-w-5xl mx-auto">
        <h3 class="text-xl text-emerald-700 text-center mb-6 font-semibold flex items-center justify-center gap-4">
          <span class="h-px bg-emerald-200 flex-grow"></span> อันดับที่เหลือ <span class="h-px bg-emerald-200 flex-grow"></span>
        </h3>
        <div id="dashboard-runners" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
          <!-- จะถูกสร้างโดย JavaScript -->
        </div>
      </div>

    </div>
  </div>

  <div id="image-modal" class="fixed inset-0 bg-black/90 z-50 hidden flex items-center justify-center p-4 modal-overlay" onclick="closeModal('image-modal')">
    <img id="modal-img" src="" class="rounded-xl shadow-2xl max-h-[85vh] max-w-full object-contain bg-white">
  </div>

  <div id="admin-modal" class="fixed inset-0 bg-black/70 z-50 hidden flex items-center justify-center p-4 modal-overlay" onclick="closeModal('admin-modal')">
    <div class="bg-white rounded-2xl w-full max-w-md p-6 shadow-2xl relative" onclick="event.stopPropagation()">
      <button onclick="closeModal('admin-modal')" class="absolute top-4 right-4 text-gray-400 bg-gray-100 rounded-full p-1 hover:bg-gray-200">✕</button>
      <h2 class="text-xl font-bold mb-5 flex items-center gap-2 text-gray-800">⚙️ ระบบจัดการ (Admin)</h2>
      
      <div class="space-y-5">
        <button onclick="downloadCSV()" class="w-full bg-yellow-50 text-yellow-700 hover:bg-yellow-100 font-semibold py-3 rounded-xl border border-yellow-200 transition-all shadow-sm">
          📥 ดาวน์โหลดสรุปผลโหวต (CSV)
        </button>
        <div class="border-t border-gray-200"></div>
        <h3 class="font-bold text-gray-700 text-lg">➕ เพิ่มตัวเลือกแบบเสื้อสูทใหม่</h3>
        
        <form id="add-option-form" class="space-y-4">
          <div>
            <label class="text-sm font-semibold text-gray-600 block mb-1">ชื่อเรียกเสื้อสูท</label>
            <input type="text" id="opt-name" class="field !py-2" placeholder="เช่น 057 เบอร์ 1" required>
          </div>
          <div>
            <label class="text-sm font-semibold text-gray-600 block mb-1">รูปตัวอย่างเสื้อ (จำเป็น)</label>
            <input type="file" id="opt-img" accept="image/*" required class="w-full text-sm p-2 border-2 border-dashed border-gray-300 rounded-xl cursor-pointer hover:border-[var(--primary-green)] bg-gray-50">
          </div>
          <button type="submit" id="btn-save-opt" class="btn-submit w-full py-3 rounded-xl font-bold mt-2 shadow-md">อัปโหลดและบันทึก</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    // ===== ใส่ลิงก์ Apps Script ของคุณตรงนี้ =====
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxYTWNZ2AEW7-sYbDveS9GyYuLi8BCnri6sluOrfW7A8TJ-vtVCRsbOGy4dO9C3eM31oA/exec'; 
    // ===== อัปเดต API KEY เรียบร้อยแล้ว =====
    const IMGBB_API_KEY = 'c924b331d25dfd52f01c19c5f21a6222'; 
    
    const CHART_COLORS = ['#89C040', '#FFB800', '#F4A261', '#2A9D8F', '#E76F51', '#457B9D', '#E9C46A'];
    const $ = id => document.getElementById(id);
    let chart = null, currentOptions = [], currentResults = {};
    let autoRefreshInterval = null;

    function switchView(view) {
      if(view === 'dashboard') {
        $('view-vote').style.display = 'none'; 
        $('vote-header').classList.add('hidden'); 
        $('view-dashboard').style.display = 'block';
        autoRefreshInterval = setInterval(loadData, 5000); 
        setTimeout(() => renderPageantDashboard(), 100);
      } else {
        $('view-dashboard').style.display = 'none'; 
        $('vote-header').classList.remove('hidden'); 
        $('view-vote').style.display = 'flex'; 
        clearInterval(autoRefreshInterval);
      }
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) { document.documentElement.requestFullscreen(); } 
      else { if (document.exitFullscreen) document.exitFullscreen(); }
    }

    function openModal(e, src) { e.preventDefault(); e.stopPropagation(); $('modal-img').src = src; $('image-modal').classList.remove('hidden'); }
    function closeModal(id) { $(id).classList.add('hidden'); }
    function openAdmin() { 
      Swal.fire({
        title: 'รหัสผ่านแอดมิน',
        input: 'password',
        inputPlaceholder: 'กรอกรหัสผ่าน (1234)',
        showCancelButton: true,
        confirmButtonText: 'ยืนยัน',
        cancelButtonText: 'ยกเลิก',
        confirmButtonColor: '#89C040'
      }).then((result) => {
        if (result.value === "1234") {
          $('admin-modal').classList.remove('hidden');
        } else if (result.value) {
          Swal.fire({ icon: 'error', title: 'รหัสผ่านผิด', confirmButtonColor: '#89C040' });
        }
      });
    }

    function buildVotingForm(options) {
      const container = $('dynamic-choices');
      container.innerHTML = options.length ? '' : '<p class="text-red-500 text-sm col-span-2 text-center p-4 bg-red-50 rounded-xl">แอดมินยังไม่ได้ตั้งค่าตัวเลือก</p>';
      options.forEach(opt => {
        container.innerHTML += `<label class="choice group">
          <div class="choice-img-container cursor-zoom-in" onclick="openModal(event, '${opt.image}')"><img src="${opt.image}" class="choice-img" loading="lazy"><div class="zoom-hint">🔍 ขยาย</div></div>
          <div class="flex items-center gap-3 w-full mt-1 px-1"><input type="radio" name="color-choice" value="${opt.id}" required><span class="font-semibold text-gray-700 group-hover:text-gray-900 text-lg">${opt.label}</span></div>
        </label>`;
      });
    }

    function buildResultsView(options, votes) {
      let counts = {}; options.forEach(opt => counts[opt.id] = 0);
      votes.forEach(v => { if(counts[v] !== undefined) counts[v]++; });
      currentResults = counts;
      
      $('total-votes').textContent = votes.length;
      $('dash-total').textContent = votes.length; 
      
      const labels = options.map(opt => opt.label);
      const dataValues = options.map(opt => counts[opt.id]);
      const bgColors = options.map((_, i) => CHART_COLORS[i % CHART_COLORS.length]);

      if (chart) { 
        chart.data.labels = labels; chart.data.datasets[0].data = dataValues; chart.data.datasets[0].backgroundColor = bgColors; chart.update(); 
      } else { 
        chart = new Chart($('results-chart'), { type: 'bar', data: { labels: labels, datasets: [{ data: dataValues, backgroundColor: bgColors, borderRadius: 6 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1, precision: 0 } }, x: { display: false } } } }); 
      }
      
      if($('view-dashboard').style.display === 'block') {
        renderPageantDashboard();
      }
    }

    function renderPageantDashboard() {
      let sortedData = currentOptions.map(opt => ({
        ...opt,
        votes: currentResults[opt.id] || 0
      })).sort((a, b) => b.votes - a.votes);

      const podiumContainer = $('dashboard-podium');
      const runnersContainer = $('dashboard-runners');
      
      if(sortedData.length === 0) {
        podiumContainer.innerHTML = `<div class="text-emerald-700 font-medium text-xl w-full text-center bg-white/50 py-4 rounded-xl">ยังไม่มีตัวเลือกให้โหวต</div>`;
        return;
      }

      const top1 = sortedData[0] || null;
      const top2 = sortedData[1] || null;
      const top3 = sortedData[2] || null;

      let podiumHTML = ``;
      
      if(top2) {
        podiumHTML += `
          <div class="podium-item rank-2 transform transition hover:scale-105">
            <div class="text-gray-800 text-lg sm:text-xl font-bold mb-2 break-words w-full px-2 drop-shadow-sm line-clamp-2">${top2.label}</div>
            <div class="text-gray-700 font-bold text-xl sm:text-2xl mb-4 bg-white/90 px-4 py-1.5 rounded-full border border-gray-200 shadow-sm">${top2.votes} โหวต</div>
            <img src="${top2.image}" class="podium-img shadow-lg">
            <div class="podium-base"><span class="podium-rank-num">2</span></div>
          </div>`;
      } else { podiumHTML += `<div class="podium-item"></div>`; }

      if(top1) {
        podiumHTML += `
          <div class="podium-item rank-1 transform transition hover:scale-105 z-20">
            <div class="text-5xl sm:text-6xl drop-shadow-[0_5px_15px_rgba(255,215,0,0.5)] animate-bounce mb-2">👑</div>
            <div class="text-gray-800 text-xl sm:text-2xl font-bold mb-2 break-words w-full px-2 drop-shadow-sm line-clamp-2">${top1.label}</div>
            <div class="text-emerald-700 font-bold text-2xl sm:text-3xl mb-4 bg-white/95 px-6 py-2 rounded-full border-2 border-yellow-400 shadow-md">${top1.votes} โหวต</div>
            <img src="${top1.image}" class="podium-img shadow-xl">
            <div class="podium-base"><span class="podium-rank-num">1</span></div>
          </div>`;
      }

      if(top3) {
        podiumHTML += `
          <div class="podium-item rank-3 transform transition hover:scale-105">
            <div class="text-gray-800 text-lg sm:text-xl font-bold mb-2 break-words w-full px-2 drop-shadow-sm line-clamp-2">${top3.label}</div>
            <div class="text-gray-700 font-bold text-xl sm:text-2xl mb-4 bg-white/90 px-4 py-1.5 rounded-full border border-gray-200 shadow-sm">${top3.votes} โหวต</div>
            <img src="${top3.image}" class="podium-img shadow-lg">
            <div class="podium-base"><span class="podium-rank-num">3</span></div>
          </div>`;
      } else { podiumHTML += `<div class="podium-item"></div>`; }

      podiumContainer.innerHTML = podiumHTML;

      const runners = sortedData.slice(3);
      if(runners.length > 0) {
        let runnersHTML = '';
        runners.forEach((runner, idx) => {
          runnersHTML += `
            <div class="bg-white/80 backdrop-blur-sm border border-white rounded-xl p-3 flex flex-col items-center text-center transform transition hover:-translate-y-1 hover:shadow-lg shadow-sm">
              <span class="bg-emerald-100 text-emerald-700 text-xs font-bold px-2 py-1 rounded mb-2 w-full text-left">อันดับ ${idx + 4}</span>
              <div class="w-full h-24 bg-gray-50 rounded-lg p-1 mb-2 overflow-hidden border border-gray-100"><img src="${runner.image}" class="w-full h-full object-contain"></div>
              <div class="text-gray-700 font-medium text-sm line-clamp-1 w-full" title="${runner.label}">${runner.label}</div>
              <div class="text-[var(--primary-green)] font-bold text-lg mt-1">${runner.votes} โหวต</div>
            </div>
          `;
        });
        runnersContainer.innerHTML = runnersHTML;
      } else {
        runnersContainer.innerHTML = `<div class="col-span-full text-center text-emerald-700 bg-white/40 py-3 rounded-lg font-medium">ไม่มีตัวเลือกอื่นแล้ว</div>`;
      }
    }

    async function loadData() {
      try {
        if($('view-vote').style.display !== 'none') $('loading').classList.remove('hidden');
        const res = await fetch(SCRIPT_URL);
        const data = await res.json();
        currentOptions = data.options;
        buildVotingForm(data.options);
        buildResultsView(data.options, data.votes);
        
        let sortedOptions = [...data.options].map(opt => ({...opt, votes: currentResults[opt.id] || 0})).sort((a, b) => b.votes - a.votes);
        $('results-list').innerHTML = '';
        sortedOptions.forEach((opt, index) => {
          let crown = index === 0 ? '👑 ' : '';
          let color = index === 0 ? '#FFB800' : CHART_COLORS[index % CHART_COLORS.length];
          $('results-list').innerHTML += `<div class="flex justify-between items-center bg-gray-50 border border-gray-100 p-3 rounded-xl hover:bg-gray-100 transition"><span class="flex items-center gap-2.5"><span class="w-4 h-4 rounded-full" style="background:${color}"></span><span class="text-gray-700 font-medium">${crown}${opt.label}</span></span><strong class="text-gray-900 text-base">${opt.votes} โหวต</strong></div>`;
        });

      } catch (e) { console.log(e); } 
      finally { $('loading').classList.add('hidden'); }
    }

    $('vote-form').addEventListener('submit', async e => {
      e.preventDefault();
      const choice = document.querySelector('input[name="color-choice"]:checked');
      if (!choice) return;
      $('submit-button').disabled = true;

      Swal.fire({ title: 'กำลังบันทึกผลโหวต...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); }});

      try {
        await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'vote', voterName: $('voter-name').value.trim(), optionId: choice.value }) });
        $('vote-form').reset(); 
        loadData(); 
        window.scrollTo({ top: 0, behavior: 'smooth' });
        Swal.fire({ icon: 'success', title: 'โหวตเรียบร้อย!', text: 'ขอบคุณที่ร่วมออกเสียงครับ', confirmButtonColor: '#89C040' });
      } catch (err) { 
        Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด', text: 'ไม่สามารถส่งข้อมูลได้ โปรดลองอีกครั้ง', confirmButtonColor: '#89C040' });
      } finally { 
        $('submit-button').disabled = false; 
      }
    });

    $('add-option-form').addEventListener('submit', async e => {
      e.preventDefault();
      $('btn-save-opt').disabled = true;
      
      const file = $('opt-img').files[0];
      if(!file) return;

      Swal.fire({ title: 'กำลังอัปโหลดรูปภาพ...', html: 'กรุณารอสักครู่', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); }});

      const formData = new FormData();
      formData.append('image', file);

      try {
        const imgRes = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: 'POST', body: formData });
        const imgData = await imgRes.json();
        
        if(imgData.success) {
          Swal.fire({ title: 'กำลังบันทึกลงระบบ...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); }});
          
          const payload = { action: 'addOption', name: $('opt-name').value, imageUrl: imgData.data.url };
          await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
          
          $('add-option-form').reset(); 
          loadData();
          
          Swal.fire({ icon: 'success', title: 'เพิ่มตัวเลือกสำเร็จ!', text: 'อัปโหลดภาพถัดไปได้เลย', confirmButtonColor: '#89C040', timer: 2500 });
        } else { 
          throw new Error(imgData.error ? imgData.error.message : "เซิร์ฟเวอร์ปฏิเสธไฟล์ภาพ"); 
        }
      } catch(err) { 
        Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด', text: err.message, confirmButtonColor: '#89C040' });
      } finally { 
        $('btn-save-opt').disabled = false; 
      }
    });

    function downloadCSV() {
      let csv = "data:text/csv;charset=utf-8,\uFEFFID,ชื่อเสื้อ,จำนวนโหวต\n";
      currentOptions.forEach(opt => csv += `"${opt.id}","${opt.label}",${currentResults[opt.id]||0}\n`);
      const link = document.createElement("a"); link.href = encodeURI(csv); link.download = "สรุปผลโหวต.csv"; document.body.appendChild(link); link.click(); document.body.removeChild(link);
    }

    loadData();
  </script>
</body>
</html>
