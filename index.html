<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ระบบโหวตสีเสื้อสูทโรงเรียน</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <style>
    :root {
      --bg-color: #FAF4E1; /* สีพื้นหลังครีมเหลืองอ่อน */
      --primary-green: #89C040; /* สีเขียวตามโลโก้เพชรราชพฤกษ์ */
      --primary-yellow: #FFB800;
      --text-dark: #2D3748;
    }
    body { 
      font-family: "IBM Plex Sans Thai", sans-serif; 
      background: linear-gradient(135deg, #FAF4E1 0%, #E8F5E9 100%);
      color: var(--text-dark);
      min-height: 100vh;
    }
    .vote-card { 
      background: rgba(255, 255, 255, 0.9);
      border-radius: 24px; 
      box-shadow: 0 10px 40px rgba(0,0,0,0.05); 
      border: 1px solid rgba(255,255,255,0.5);
      backdrop-filter: blur(10px);
    }
    .choice { 
      display: flex; align-items: center; gap: 15px; width: 100%; 
      padding: 14px; border: 2px solid #E2E8F0; border-radius: 16px; 
      background: #fff; cursor: pointer; transition: all 0.2s; 
    }
    .choice:hover { border-color: var(--primary-green); transform: translateY(-2px); }
    .choice:has(input:checked) { border-color: var(--primary-green); background: #F0F9E8; }
    .choice input { accent-color: var(--primary-green); width: 20px; height: 20px; }
    .swatch { width: 40px; height: 40px; border-radius: 50%; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .field { width: 100%; min-height: 48px; border: 2px solid #E2E8F0; border-radius: 12px; padding: 10px 14px; transition: border-color 0.2s; }
    .field:focus { outline: none; border-color: var(--primary-green); }
    .btn-submit { background: var(--primary-green); color: white; transition: all 0.2s; }
    .btn-submit:hover { background: #76A836; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(137, 192, 64, 0.3); }
    .btn-submit:disabled { opacity: 0.6; cursor: wait; transform: none; box-shadow: none; }
    .rise { animation: rise 0.6s ease-out forwards; opacity: 0; transform: translateY(20px); }
    @keyframes rise { to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="w-full flex items-center justify-center p-4">

  <main class="max-w-4xl w-full grid md:grid-cols-2 gap-6 items-start mt-10 mb-10">
    <!-- หน้าต่างโหวต -->
    <section class="vote-card p-6 sm:p-8 rise" style="animation-delay: 0.1s;">
      <div class="text-center mb-6">
        <h1 class="text-2xl font-bold text-gray-800">โหวตสีเสื้อสูทโรงเรียน</h1>
        <p class="text-gray-500 mt-2 text-sm">กรุณากรอกชื่อและเลือกสีที่คุณชื่นชอบที่สุด</p>
      </div>

      <div id="notice" class="hidden mb-4 rounded-xl px-4 py-3 font-medium text-sm text-center"></div>

      <form id="vote-form">
        <div class="mb-5">
          <label class="block font-semibold mb-2 text-sm text-gray-700" for="voter-name">ชื่อ-นามสกุล (ผู้โหวต)</label>
          <input id="voter-name" class="field" type="text" placeholder="ระบุชื่อของคุณ..." required>
        </div>
        
        <fieldset>
          <legend class="font-semibold mb-3 text-sm text-gray-700">เลือกสีเสื้อสูท</legend>
          <div class="grid grid-cols-1 gap-3">
            <label class="choice"> 
              <input type="radio" name="color-choice" value="navy" required> 
              <span class="swatch" style="background:#253c59"></span> 
              <span class="font-semibold">สีกรมท่า (Navy)</span> 
            </label>
            <label class="choice"> 
              <input type="radio" name="color-choice" value="charcoal" required> 
              <span class="swatch" style="background:#42494b"></span> 
              <span class="font-semibold">สีเทาเข้ม (Charcoal)</span> 
            </label>
            <label class="choice"> 
              <input type="radio" name="color-choice" value="sand" required> 
              <span class="swatch" style="background:#c6ac87"></span> 
              <span class="font-semibold">สีเบจ (Sand)</span> 
            </label>
            <label class="choice"> 
              <input type="radio" name="color-choice" value="burgundy" required> 
              <span class="swatch" style="background:#713e49"></span> 
              <span class="font-semibold">สีแดงไวน์ (Burgundy)</span> 
            </label>
          </div>
        </fieldset>
        
        <button id="submit-button" type="submit" class="btn-submit mt-6 w-full rounded-full py-3 px-5 font-bold text-lg flex justify-center items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2L15 22 11 13 2 9 22 2z"/></svg>
          ส่งผลโหวต
        </button>
      </form>
    </section>

    <!-- หน้าต่างแสดงผล (อัปเดตเรียลไทม์) -->
    <section class="vote-card p-6 sm:p-8 rise" style="animation-delay: 0.3s;">
      <div class="flex justify-between items-start mb-4">
        <div>
          <h2 class="text-xl font-bold text-gray-800">ผลโหวตปัจจุบัน</h2>
          <p class="text-xs text-gray-500 mt-1">อัปเดตข้อมูลจากระบบ</p>
        </div>
        <div class="text-right">
          <span id="total-votes" class="block font-bold text-3xl text-[var(--primary-yellow)] leading-none">0</span> 
          <span class="text-xs text-gray-500 block mt-1">โหวตทั้งหมด</span>
        </div>
      </div>
      
      <div class="relative w-full mt-4" style="height:250px">
        <canvas id="results-chart"></canvas>
      </div>

      <div class="mt-6 space-y-2 text-sm">
        <div class="flex justify-between items-center bg-gray-50 p-2 rounded-lg">
          <span class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-[#253c59]"></span>กรมท่า</span><strong id="count-navy">0</strong>
        </div>
        <div class="flex justify-between items-center bg-gray-50 p-2 rounded-lg">
          <span class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-[#42494b]"></span>เทาเข้ม</span><strong id="count-charcoal">0</strong>
        </div>
        <div class="flex justify-between items-center bg-gray-50 p-2 rounded-lg">
          <span class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-[#c6ac87]"></span>เบจ</span><strong id="count-sand">0</strong>
        </div>
        <div class="flex justify-between items-center bg-gray-50 p-2 rounded-lg">
          <span class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-[#713e49]"></span>แดงไวน์</span><strong id="count-burgundy">0</strong>
        </div>
      </div>
    </section>
  </main>

  <script>
    // ===== ใส่ URL ที่ได้จาก Google Apps Script ตรงนี้ =====
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwQJtKe9kE0c5ojkvgm2fE2BpoeMl9-VjCtHaIXdjLblUhEfNYhOZMeq3F8rpfQl9bCQA/exec'; 
    // ===============================================

    const colors = [
      { id:'navy', label:'กรมท่า', hex:'#253c59' },
      { id:'charcoal', label:'เทาเข้ม', hex:'#42494b' },
      { id:'sand', label:'เบจ', hex:'#c6ac87' },
      { id:'burgundy', label:'แดงไวน์', hex:'#713e49' }
    ];
    const $ = id => document.getElementById(id);
    let chart = null;

    function showNotice(message, error = false) {
      const el = $('notice');
      el.textContent = message;
      el.classList.remove('hidden');
      if (error) {
        el.className = 'mb-4 rounded-xl px-4 py-3 font-medium text-sm text-center bg-red-100 text-red-700 border border-red-200';
      } else {
        el.className = 'mb-4 rounded-xl px-4 py-3 font-medium text-sm text-center bg-green-100 text-green-700 border border-green-200';
      }
      setTimeout(() => el.classList.add('hidden'), 5000);
    }

    function renderResults(data) {
      const counts = Object.fromEntries(colors.map(c => [c.id, 0]));
      data.forEach(record => {
        if (counts[record.color_choice] !== undefined) counts[record.color_choice]++;
      });
      
      const total = data.length;
      $('total-votes').textContent = total;
      colors.forEach(c => $('count-' + c.id).textContent = counts[c.id]);

      const values = colors.map(c => counts[c.id]);
      
      if (chart) {
        chart.data.datasets[0].data = values;
        chart.update();
      } else {
        chart = new Chart($('results-chart'), {
          type: 'bar',
          data: {
            labels: colors.map(c => c.label),
            datasets: [{
              data: values,
              backgroundColor: colors.map(c => c.hex),
              borderRadius: 8,
              barPercentage: 0.6
            }]
          },
          options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              y: { beginAtZero: true, ticks: { stepSize: 1 } },
              x: { grid: { display: false } }
            }
          }
        });
      }
    }

    // ฟังก์ชันโหลดข้อมูลตอนเปิดหน้าเว็บ
    async function loadData() {
      try {
        const response = await fetch(SCRIPT_URL);
        const data = await response.json();
        renderResults(data);
      } catch (error) {
        console.error("Error loading data:", error);
      }
    }

    // เมื่อกดปุ่มส่งข้อมูล
    $('vote-form').addEventListener('submit', async event => {
      event.preventDefault();
      const name = $('voter-name').value.trim();
      const choice = document.querySelector('input[name="color-choice"]:checked');
      
      if (!name || !choice) {
        showNotice('กรุณากรอกชื่อและเลือกสี', true);
        return;
      }

      $('submit-button').disabled = true;
      $('submit-button').innerHTML = 'กำลังบันทึก...';

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ voter_name: name, color_choice: choice.value })
        });
        
        showNotice('บันทึกผลโหวตเรียบร้อย ขอบคุณครับ!');
        $('vote-form').reset();
        loadData(); // โหลดกราฟใหม่
      } catch (error) {
        showNotice('เกิดข้อผิดพลาด กรุณาลองใหม่', true);
      } finally {
        $('submit-button').disabled = false;
        $('submit-button').innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2L15 22 11 13 2 9 22 2z"/></svg> ส่งผลโหวต';
      }
    });

    // เรียกดึงข้อมูลทันทีเมื่อเปิดหน้า
    loadData();
  </script>
</body>
</html>
